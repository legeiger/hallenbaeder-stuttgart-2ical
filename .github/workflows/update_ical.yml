name: Update iCal Calendar

on:
  schedule:
    # Läuft alle 3 Tage jeweils um 06:00 Uhr UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Erlaubt manuelles Starten zum Testen direkt in GitHub Actions
  push:
    branches:
      - main
    paths:
      - 'generate_ical.py'
      - 'requirements.txt'
      - '.github/workflows/update_ical.yml'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: iCal-Datei generieren
        run: python generate_ical.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hallenbaeder.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update hallenbaeder.ics" && git push)
